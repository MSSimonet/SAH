<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAH TV — Vista Móvil (iPhone 390×844)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg: #090305;
    --card: #15060b;
    --line: rgba(255,255,255,0.12);
    --accent: #E0314B;
    --accent-soft: rgba(224,49,75,0.18);
    --text: #f6eaeb;
    --text-2: #ab8e93;
    --font: 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-image: 
      radial-gradient(at 50% 0%, rgba(224,49,75,0.15) 0%, transparent 60%),
      radial-gradient(at 80% 80%, rgba(120,16,26,0.2) 0%, transparent 50%);
  }

  /* Barra Superior de Control */
  .top-bar {
    width: 100%;
    background: rgba(13,4,7,0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    z-index: 100;
  }

  .brand-badge {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-badge .icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #fff;
    border: 1.5px solid var(--accent);
    display: grid;
    place-items: center;
  }
  .brand-badge .icon svg { width: 18px; height: 18px; }
  .brand-badge b { font-size: 14px; }
  .brand-badge span { font-size: 11px; color: var(--accent); font-weight: 600; background: var(--accent-soft); padding: 2px 8px; border-radius: 99px; }

  .nav-tabs-bar {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tab-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 99px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text-2);
    transition: all 0.3s ease;
  }
  .tab-btn:hover {
    color: #fff;
    border-color: var(--accent);
  }
  .tab-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 4px 14px -4px var(--accent);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .c-btn {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.3s;
  }
  .c-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Contenedor del Móvil */
  .device-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px 40px;
    width: 100%;
  }

  .mobile-shell {
    width: 390px;
    height: 844px;
    background: #000;
    border-radius: 52px;
    box-shadow: 
      0 30px 80px -15px rgba(0,0,0,0.9),
      0 0 0 12px #200911,
      0 0 0 14px rgba(255,255,255,0.2);
    overflow: hidden;
    position: relative;
    transform-origin: center top;
  }

  .mobile-shell.landscape {
    width: 844px;
    height: 390px;
  }

  /* Dynamic Island / Notch */
  .notch {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 28px;
    background: #000;
    border-radius: 20px;
    z-index: 20;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
  }
  .notch-cam { width: 10px; height: 10px; border-radius: 50%; background: #111; border: 1px solid #222; }
  .notch-sensor { width: 10px; height: 10px; border-radius: 50%; background: #0c0818; }

  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #120307;
  }
</style>
</head>
<body>

<header class="top-bar">
  <div class="brand-badge">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="var(--accent)" stroke="none" aria-hidden="true"><path d="M12 2.5c0 0-6.5 7.4-6.5 11.6a6.5 6.5 0 0 0 13 0C18.5 9.9 12 2.5 12 2.5z"/></svg>
    </div>
    <b>SAH TV</b>
    <span>Pestaña Móvil (390 × 844)</span>
  </div>

  <nav class="nav-tabs-bar">
    <a href="mobile.html" class="tab-btn active"><i class="fa-solid fa-mobile-screen"></i> Pestaña Móvil</a>
    <a href="tablet.html" class="tab-btn" target="_blank"><i class="fa-solid fa-tablet-screen-button"></i> Abrir Pestaña Tablet <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:10px;margin-left:2px"></i></a>
    <a href="index.html" class="tab-btn" target="_blank"><i class="fa-solid fa-display"></i> Abrir Pestaña PC <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:10px;margin-left:2px"></i></a>
  </nav>

  <div class="controls">
    <button class="c-btn" id="btnRotate" title="Girar horizontal / vertical"><i class="fa-solid fa-rotate"></i> Rotar</button>
    <button class="c-btn" id="btnReload" title="Recargar vista móvil"><i class="fa-solid fa-rotate-right"></i> Recargar</button>
  </div>
</header>

<main class="device-stage">
  <div class="mobile-shell" id="shell">
    <div class="notch">
      <div class="notch-sensor"></div>
      <div class="notch-cam"></div>
    </div>
    <iframe src="index.html?view=mobile" id="appFrame" title="SAH TV Móvil"></iframe>
  </div>
</main>

<script>
  const shell = document.getElementById('shell');
  const frame = document.getElementById('appFrame');
  let isLandscape = false;

  document.getElementById('btnRotate').onclick = () => {
    isLandscape = !isLandscape;
    shell.classList.toggle('landscape', isLandscape);
  };

  document.getElementById('btnReload').onclick = () => {
    frame.src = frame.src;
  };
</script>

</body>
</html>
